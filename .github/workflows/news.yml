name: ニュースを集めて公開

on:
  schedule:
    # 朝: 日本時間 5:47 に開始（6:30 までに届くよう早めに。GitHub の混雑で遅れることがあるため）
    - cron: '47 20 * * *'
    # 朝の予備: 6:17 に、まだ朝の号ができていなければ作る
    - cron: '17 21 * * *'
    # 昼 11:30 / 夜 18:30 ごろ
    - cron: '30 2 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['docs/**', '!docs/data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 部品をインストール
        if: github.event_name != 'push'
        run: npm ci --no-audit --no-fund

      - name: ニュースを集める
        if: github.event_name != 'push'
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 使う AI モデル（Settings → Secrets and variables → Actions → Variables で NEWS_AI_MODEL を設定すると変更できます）
          NEWS_AI_MODEL: ${{ vars.NEWS_AI_MODEL }}
          # 無料の Google Gemini を使うためのキー（ANTHROPIC_API_KEY があればそちらを優先）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_GEMINI_MODEL: ${{ vars.NEWS_GEMINI_MODEL }}
          # 予備の実行では、その号がもうできていれば何もしない
          NEWS_ONLY_IF_MISSING: ${{ github.event.schedule == '17 21 * * *' && '1' || '' }}
        run: node scripts/build-edition.mjs

      - name: 集めたデータを保存
        if: github.event_name != 'push'
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "ニュース更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          # 実行中にほかの変更が入っても保存できるよう、最新を取り込んでから送る
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
