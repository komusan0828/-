name: ニュースを集めて公開

on:
  schedule:
    # 日本時間 6:30 / 11:30 / 18:30 ごろ（GitHub の混雑で数十分遅れることがあります）
    - cron: '30 21 * * *'
    - cron: '30 2 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['docs/**', '!docs/data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 部品をインストール
        if: github.event_name != 'push'
        run: npm ci --no-audit --no-fund

      - name: ニュースを集める
        if: github.event_name != 'push'
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 使う AI モデル（Settings → Secrets and variables → Actions → Variables で NEWS_AI_MODEL を設定すると変更できます）
          NEWS_AI_MODEL: ${{ vars.NEWS_AI_MODEL }}
          # 無料の Google Gemini を使うためのキー（ANTHROPIC_API_KEY があればそちらを優先）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_GEMINI_MODEL: ${{ vars.NEWS_GEMINI_MODEL }}
        run: node scripts/build-edition.mjs

      - name: 集めたデータを保存
        if: github.event_name != 'push'
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "ニュース更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
