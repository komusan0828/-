name: ニュースを集めて公開

on:
  schedule:
    # GitHub の予約実行は40分〜1時間遅れることがあるため、届けたい時刻より早めに開始し、予備も入れる
    # 朝（5:00 までに）: 3:43 開始、予備 4:23
    - cron: '43 18 * * *'
    - cron: '23 19 * * *'
    # 昼（11:00 までに）: 9:43 開始、予備 10:23
    - cron: '43 0 * * *'
    - cron: '23 1 * * *'
    # 夜（16:30 までに）: 15:13 開始、予備 15:53
    - cron: '13 6 * * *'
    - cron: '53 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['docs/**', '!docs/data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 部品をインストール
        if: github.event_name != 'push'
        run: npm ci --no-audit --no-fund

      - name: ニュースを集める
        if: github.event_name != 'push'
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 使う AI モデル（Settings → Secrets and variables → Actions → Variables で NEWS_AI_MODEL を設定すると変更できます）
          NEWS_AI_MODEL: ${{ vars.NEWS_AI_MODEL }}
          # 無料の Google Gemini を使うためのキー（ANTHROPIC_API_KEY があればそちらを優先）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_GEMINI_MODEL: ${{ vars.NEWS_GEMINI_MODEL }}
          # 予備の実行では、その号がもうできていれば何もしない
          NEWS_ONLY_IF_MISSING: ${{ (github.event.schedule == '23 19 * * *' || github.event.schedule == '23 1 * * *' || github.event.schedule == '53 6 * * *') && '1' || '' }}
          # どの予約の実行かで、朝・昼・夜のどの号かを決める（手動実行のときは時刻で判断）
          NEWS_SLOT: ${{ (github.event.schedule == '43 18 * * *' || github.event.schedule == '23 19 * * *') && 'am' || (github.event.schedule == '43 0 * * *' || github.event.schedule == '23 1 * * *') && 'noon' || (github.event.schedule == '13 6 * * *' || github.event.schedule == '53 6 * * *') && 'pm' || '' }}
        run: node scripts/build-edition.mjs

      - name: 集めたデータを保存
        if: github.event_name != 'push'
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "ニュース更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          # 実行中にほかの変更が入っても保存できるよう、最新を取り込んでから送る
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
